name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-core:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  adapters:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - name: Python unit tests
        run: python -m unittest discover -s tests/python -v
      - name: Web contract tests
        run: node --test tests/web/bare_web.test.mjs
      - name: Rust quality gate
        run: |
          cargo fmt --manifest-path \
            bindings/rust/todo-core/Cargo.toml --check
          cargo clippy --manifest-path \
            bindings/rust/todo-core/Cargo.toml \
            --all-targets -- -D warnings
          cargo test --manifest-path \
            bindings/rust/todo-core/Cargo.toml
